version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  auto_route: ^11.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  auto_route_generator: ^10.5.0
