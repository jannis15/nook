name: nook
description: "Flutter client for Nook."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  auto_route: ^11.1.0
  bloc_presentation: ^1.1.2+3
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logging: ^1.3.0
  multiple_result: ^5.3.0
  rxdart: ^0.28.0
  supabase_flutter: ^2.16.0
  toastification: ^3.2.0
  video_player: ^2.11.1

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.11.3

flutter_gen:
  output: lib/presentation/gen/
  line_length: 120
  integrations:
    flutter_svg: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/tanuki-button-icon.svg
  fonts:
    - family: DM Sans
      fonts:
        - asset: "assets/fonts/DMSans-VariableFont_opsz,wght.ttf"
    - family: Fraunces
      fonts:
        - asset: "assets/fonts/Fraunces-Bold.ttf"
          weight: 700
        - asset: "assets/fonts/Fraunces-ExtraBold.ttf"
          weight: 800
