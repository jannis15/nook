<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f1ea;color:#2d2925;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fffdf8;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:40px 40px 16px;">
                <p style="margin:0 0 24px;font-size:24px;font-weight:700;letter-spacing:-0.4px;">Nook</p>
                <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;">Confirm your email</h1>
                <p style="margin:0;font-size:16px;line-height:1.6;">Welcome to Nook. Confirm <strong>{{ .Email }}</strong> to finish setting up your private space for the moments that matter.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 40px 40px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;background:#2d6a4f;border-radius:8px;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">Confirm email</a>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#756f68;">If you did not create a Nook account, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
